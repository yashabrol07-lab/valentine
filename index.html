<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1b1b2f, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    img {
      width: 220px;
      animation: bloom 4s ease forwards;
      filter: drop-shadow(0 0 20px pink);
    }

    h1 {
      color: #ffd6e8;
      margin-top: 20px;
      font-weight: normal;
      opacity: 0;
      animation: textFade 2s ease forwards;
      animation-delay: 4s;
    }

    @keyframes bloom {
      0% {
        transform: scale(0.2);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes textFade {
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="flower.jpeg" alt="Flower">
    <h1>Will you be my Valentine? 💖</h1>
  </div>
</body>
</html>
